name: Build Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZENO-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ZENO.apk
      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-${{ github.run_number }}
          name: ZENO preview ${{ github.run_number }}
          prerelease: false
          make_latest: true
          body: نسخة تجريبية من تطبيق ZENO لأندرويد. حمّل ملف ZENO.apk وثبّته على جوالك.
          files: ZENO.apk
