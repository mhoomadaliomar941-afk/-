<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الشروط · نزيه</title>
<meta name="description" content="احجز مكان بمنتج، والنتيجة بتقدر تتحقق منها بنفسك. وإذا ما طلع مكانك، المبلغ كامل بيرجعلك رصيد تسوق.">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); font-size: 16px; line-height: 1.7; }
  a { color: var(--color-accent); }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  .num { unicode-bidi: isolate; direction: ltr; font-variant-numeric: tabular-nums; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; text-decoration: none; color: var(--color-text); }
  .logo img { width: 32px; height: 32px; border-radius: 8px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; border-radius: var(--radius-md); border: 0; background: var(--color-accent); color: var(--color-on-accent); font: 600 16px var(--font-sans); text-decoration: none; cursor: pointer; }
  .btn:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
  .btn.secondary { background: var(--color-accent-soft); color: var(--color-accent-strong); }
  section { padding: 56px 0; }
  h1 { font-size: clamp(30px, 6vw, 46px); line-height: 1.3; margin: 0 0 12px; }
  h2 { font-size: clamp(24px, 4vw, 32px); line-height: 1.35; margin: 0 0 16px; }
  h3 { font-size: 18px; margin: 0 0 6px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--color-text-muted); }
  .hero { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 40px; align-items: center; padding-top: 24px; }
  .hero .lead { font-size: 19px; color: var(--color-text-muted); max-width: 520px; }
  .shots { display: flex; gap: 16px; justify-content: center; }
  .shots img { width: min(220px, 42vw); height: auto; border-radius: 24px; border: 1px solid var(--color-border); box-shadow: var(--shadow-card); background: var(--color-surface); }
  .shots img:last-child { margin-top: 40px; }
  .band { background: var(--color-surface); }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card { background: var(--color-surface-raised); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 20px; }
  .step { font-weight: 700; color: var(--color-accent-strong); background: var(--color-accent-soft); width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; margin-bottom: 10px; }
  .problem li { margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; background: var(--color-surface-raised); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--color-border); }
  th, td { text-align: start; padding: 12px 16px; border-bottom: 1px solid var(--color-border); vertical-align: top; }
  th { font-weight: 600; width: 40%; }
  tr:last-child th, tr:last-child td { border-bottom: 0; }
  details { background: var(--color-surface-raised); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 4px 16px; margin-bottom: 10px; }
  summary { cursor: pointer; font-weight: 600; min-height: 48px; display: flex; align-items: center; }
  details p { color: var(--color-text-muted); }
  .todo { background: var(--color-warning-soft); color: var(--color-warning); border-radius: 8px; padding: 2px 8px; font-size: 14px; }
  form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-weight: 600; font-size: 14px; }
  .phone { display: flex; align-items: center; direction: ltr; height: 48px; border: 1px solid var(--color-border-input); border-radius: var(--radius-md); background: var(--color-bg); padding: 0 12px; gap: 8px; }
  .phone span { color: var(--color-text-muted); }
  .phone input { border: 0; outline: none; background: transparent; color: var(--color-text); font: 16px var(--font-sans); width: 150px; height: 100%; }
  .consent { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--color-text-muted); width: 100%; }
  .consent input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--color-accent); }
  #msg { width: 100%; min-height: 24px; font-size: 15px; }
  .cta { text-align: center; }
  .cta form { justify-content: center; }
  .cta .consent { justify-content: center; }
  footer { padding: 32px 0 48px; color: var(--color-text-muted); font-size: 14px; border-top: 1px solid var(--color-border); }
  @media (max-width: 760px) {
    .hero, .grid3 { grid-template-columns: 1fr; }
    .hero { gap: 24px; }
    section { padding: 40px 0; }
  }
</style>
</head>
<body>
<div class="wrap">
<header><a class="logo" href="index.html"><img src="favicon.png" alt="">نزيه</a></header>
<section>
<h1>الشروط</h1>
<p><span class="todo">بتنكتب بعد الرأي القانوني: طريقة اختيار المالك، الترخيص، استرجاع الرصيد، التوصيل، والأعمار المسموحة.</span></p>
</section>
</div>
</body>
</html>
