# Configuration file

##########################################################################################################
# gameplay
#--------------------------------------------------------------------------------------------------------#
# Interaction with vanilla water, buckets and dispensers (server side).
##########################################################################################################

gameplay {
    # Convert vanilla water into physical water when it is disturbed (a neighbouring block changes).
    B:convertVanillaWater=true

    # Prevent vanilla 'infinite water source' creation.
    B:disableInfiniteSources=true

    # Undisturbed vanilla water bodies (oceans, lakes, rivers) act as infinite reservoirs at their level. If false they are converted and drained like any other water (realistic but can be expensive for oceans).
    B:naturalWaterIsInfinite=true

    # Water buckets and dispensers place finite physical water (1000 L) and empty buckets take exactly 1000 L.
    B:physicalBuckets=true
}


##########################################################################################################
# performance
#--------------------------------------------------------------------------------------------------------#
# Performance limits (server side).
##########################################################################################################

performance {
    # Only simulate water within this many chunks of a player (0 = everywhere loaded). Water elsewhere is frozen, not lost.
    # Min: 0
    # Max: 64
    I:activeChunkRadius=0

    # Maximum number of 16x16x16 sections simulated per tick (active regions). Extra sections wait (state is kept).
    # Min: 1
    # Max: 20000
    I:maxActiveSections=400

    # Maximum world block changes (water appearing/disappearing/level change) applied per tick. The rest is applied over the next ticks.
    # Min: 64
    # Max: 100000
    I:maxBlockUpdatesPerTick=4000

    # Volume change per tick (liters) below which a block is considered settled.
    # Min: 0.001
    # Max: 10.0
    D:sleepEpsilonLiters=0.05

    # A section stops being simulated after this many ticks without significant change (water settled).
    # Min: 5
    # Max: 1200
    I:sleepTicks=40

    # Number of visual height levels (8 or 16). Fewer levels = fewer chunk re-renders.
    # Min: 8
    # Max: 16
    I:visualLevels=16
}


##########################################################################################################
# physics
#--------------------------------------------------------------------------------------------------------#
# Physical constants and model coefficients (server side).
##########################################################################################################

physics {
    # Compressibility stiffness: extra head (m) per 100% of over-filling of a block. Keeps pressure propagation stable.
    # Min: 2.0
    # Max: 200.0
    D:compressionStiffness=25.0

    # Discharge coefficient Cd of openings (orifices). Torricelli: Q = Cd * A * sqrt(2 g h). Sharp-edged orifice ~ 0.61.
    # Min: 0.1
    # Max: 1.0
    D:dischargeCoefficient=0.62

    # Allow isolated tiny droplets (below minVolumeLiters) to evaporate. Evaporated water is counted in /water stats.
    B:evaporateDroplets=false

    # Gravitational acceleration in m/s^2 (Earth = 9.81).
    # Min: 0.5
    # Max: 50.0
    D:gravity=9.81

    # Fraction of the momentum of water hitting a wall/floor converted to pressure (bounce and splash strength).
    # Min: 0.0
    # Max: 2.0
    D:impactPressure=1.0

    # Surface tension approximation: a water layer thinner than this (liters per block) does not spread onto dry ground.
    # Min: 0.0
    # Max: 500.0
    D:minSpreadLiters=15.0

    # Smallest amount of water (liters) kept in a block. Smaller droplets merge into neighbouring water.
    # Min: 0.01
    # Max: 50.0
    D:minVolumeLiters=0.5

    # Momentum carry-over (0..1): how strongly moving water keeps its direction (jets from holes, travelling waves).
    # Min: 0.0
    # Max: 1.0
    D:momentum=0.5

    # Bottom / wall friction coefficient for shallow flow (higher = shallow water slows down more).
    # Min: 0.0
    # Max: 5.0
    D:surfaceFriction=0.08

    # Linear (viscous) damping of flow in 1/s. Higher = thicker, slower water.
    # Min: 0.0
    # Max: 20.0
    D:viscosity=1.0
}


##########################################################################################################
# pipes
#--------------------------------------------------------------------------------------------------------#
# Pipes, pumps and valves (server side).
##########################################################################################################

pipes {
    # Damage per second at twice the rated pressure (1.0 = burst after ~1 s).
    # Min: 0.0
    # Max: 10.0
    D:damageRate=0.25

    # Darcy friction factor of pipes (resistance). Typical 0.015 - 0.04.
    # Min: 0.001
    # Max: 1.0
    D:frictionFactor=0.025

    # Pipes accumulate damage above their pressure rating, crack (slow leak) and finally burst.
    B:pipeDamage=true

    # Maximum flow of a pump in liters per second.
    # Min: 1.0
    # Max: 5000.0
    D:pumpMaxFlow=60.0

    # Maximum head (meters of water) a powered pump can produce. 10 m = ~98 kPa.
    # Min: 1.0
    # Max: 200.0
    D:pumpMaxHead=16.0
}


##########################################################################################################
# simulation
#--------------------------------------------------------------------------------------------------------#
# Water simulation (server side).
##########################################################################################################

simulation {
    # Master switch for the physical water simulation.
    B:enabled=true

    # Pressure solver iterations per sub-step for enclosed (pressurized) water. Higher = more precise pressure.
    # Min: 1
    # Max: 16
    I:pressureIterations=2

    # Simulation sub-steps per game tick. More steps = more accurate and stable but slower.
    # Min: 1
    # Max: 16
    I:substepsPerTick=3

    # Ticks between server -> client detail syncs (velocities, impacts) for visual effects.
    # Min: 1
    # Max: 40
    I:syncInterval=4

    # Radius in blocks around each player in which water detail data is sent for visual effects.
    # Min: 8
    # Max: 256
    I:syncRadius=48

    # Simulation speed multiplier (1.0 = real time, 0.5 = slow motion, 2.0 = twice as fast).
    # Min: 0.05
    # Max: 4.0
    D:timeScale=1.0
}


##########################################################################################################
# visuals
#--------------------------------------------------------------------------------------------------------#
# Graphics and effects (client side).
##########################################################################################################

visuals {
    # Distance in blocks within which water effects are rendered.
    # Min: 8
    # Max: 128
    I:effectsRadius=40

    # Foam on impacts and fast flow.
    B:foam=true

    # Show the hydrometer HUD (volume, level, pressure, flow speed) while holding the Hydrometer.
    B:hydrometerHud=true

    # Particle density multiplier.
    # Min: 0.0
    # Max: 4.0
    D:particleDensity=1.0

    # Particle effects: splashes, spray, foam, mist, whirlpool bubbles.
    B:particles=true

    # Graphics quality preset: 0 = low, 1 = medium, 2 = high, 3 = ultra.
    # Min: 0
    # Max: 3
    I:quality=2

    # Render falling water as streams whose thickness depends on the flow (waterfalls).
    B:thinStreams=true

    # Whirlpool (vortex) effect above drains and holes in floors.
    B:vortex=true

    # Wave grid resolution per block (2..8). Higher = smoother waves, more GPU work.
    # Min: 2
    # Max: 8
    I:waveResolution=4

    # Animated wave surface overlay (ripples, small waves, surface deformation).
    B:waves=true
}


