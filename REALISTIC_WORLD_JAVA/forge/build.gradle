// Same toolchain as Forge's official 1.12.2 MDK (14.23.5.2860): ForgeGradle 3, Gradle 4.9+, Java 8.
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}
apply plugin: 'net.minecraftforge.gradle'

version = '0.3.1'
group = 'com.realisticworld'
archivesBaseName = 'realisticworld-1.12.2'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
    runs {
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
        }
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
    compile project(':core')
}

// The core classes ship inside the mod jar.
jar {
    from project(':core').sourceSets.main.output
    manifest {
        attributes([
            'Specification-Title': 'Realistic World',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': "${version}",
        ])
    }
}
jar.finalizedBy('reobfJar')

processResources {
    inputs.property 'version', project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.12.2'
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
